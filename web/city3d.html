<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Four Mayors · 3D</title>
<link rel="stylesheet" href="theme.css">
<style>
  :root { --panel: var(--surface); --line: var(--hair); }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; display:grid; grid-template-rows:auto 1fr; grid-template-columns:300px 1fr 340px; height:100vh; overflow:hidden; }
  header { grid-column:1 / -1; display:flex; gap:12px; align-items:center; padding:8px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 8px 0 0; font-weight:600; }
  .tabs { display:flex; gap:6px; }
  #year { font-variant-numeric:tabular-nums; min-width:100px; color:var(--muted); }
  #game { position:relative; overflow:hidden; }
  #game canvas { display:block; }
  #hint { position:absolute; left:12px; bottom:10px; font-size:12px; padding:4px 10px; border-radius:999px; pointer-events:none; }
  #talk { position:absolute; display:none; transform:translate(-50%,-100%); font-size:13px; cursor:pointer; text-align:center; z-index:5; }
  #talk small { display:block; color:var(--muted); font-size:11px; }
  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); background:rgba(11,13,18,.85); z-index:6; }
  #chamber { border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; overflow:hidden; }
  #chamber .portrait { display:flex; gap:10px; align-items:center; padding:12px 12px 8px; border-bottom:1px solid var(--line); }
  #chamber .portrait img { width:56px; height:56px; object-fit:contain; border-radius:12px; }
  #chamber .n { font-weight:600; font-size:15px; } #chamber .p { font-size:11px; color:var(--muted); line-height:1.35; }
  #chamber .feed { overflow:auto; padding:10px 12px; display:flex; flex-direction:column; gap:10px; }
  .bubble { border-radius:12px; padding:9px 11px; font-size:12.5px; line-height:1.45; opacity:.7; }
  .bubble .y { color:var(--muted); font-size:11px; display:flex; justify-content:space-between; }
  .bubble .saw { color:var(--muted); margin:4px 0 2px; } .bubble .saw b { color:var(--ink); font-weight:500; }
  .bubble .heard { color:#c4b5fd; margin:2px 0; font-style:italic; }
  .bubble .did { color:var(--warn); margin:4px 0 2px; font-weight:500; }
  .bubble .why { color:var(--ink); }
  .bubble .memo { color:#93c5fd; margin-top:4px; font-size:11px; }
  body.no-chamber { grid-template-columns:44px 1fr 340px; }
  body.no-chamber #chamber .portrait > div, body.no-chamber #chamber .feed, body.no-chamber #chamber #mayorImg { display:none; }
  body.no-chamber #chamber .portrait { padding:10px 6px; justify-content:center; }
  body.no-chamber #chMin::before { content:"🗣"; } body.no-chamber #chMin { font-size:16px; }
  #chMin { margin-left:auto; align-self:flex-start; padding:2px 10px; }
  body.no-panel { grid-template-columns:300px 1fr; } body.no-panel aside { display:none; }
  body.no-chamber.no-panel { grid-template-columns:44px 1fr; }
  @media (max-width: 1300px) { body { grid-template-columns:260px 1fr 300px; } }
  aside { border-left:1px solid var(--line); background:var(--panel); padding:12px 14px; overflow:auto; display:flex; flex-direction:column; gap:10px; }
  aside > * { flex-shrink:0; }
  aside .decision { max-height:110px; overflow:auto; }
  aside h2 { margin:0; font-size:13px; display:flex; justify-content:space-between; align-items:baseline; color:#9aa0aa; }
  aside h2 .score { color:var(--warn); font-variant-numeric:tabular-nums; }
  .decision { min-height:34px; }
  .health { display:grid; gap:4px; font-size:11px; color:var(--muted); }
  .hb { display:grid; grid-template-columns:70px 1fr 34px; align-items:center; gap:6px; }
  .hb.total { color:var(--ink); }
  .ht { overflow:hidden; }
  .hf { display:block; height:100%; transition:width .6s ease; }
  .hv { text-align:right; font-variant-numeric:tabular-nums; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:3px 8px; font-size:12px; color:var(--muted); }
  .stats b { color:var(--ink); font-weight:500; }
  .ticker { font-size:12px; color:var(--muted); border-top:1px solid var(--line); padding-top:6px; }
  .ticker .ev { display:block; } .ticker .up { color:var(--good); } .ticker .down { color:var(--bad); }
  .lessons { font-size:12px; border-top:1px solid var(--line); padding-top:6px; }
  .lessons .l { display:block; padding:2px 0; } .lessons .failed { color:var(--bad); text-decoration:line-through; } .lessons .held { color:var(--good); }
  .fuse { font-size:12px; color:var(--warn); }
</style>
</head>
<body>
<header>
  <h1>Four Mayors</h1>
  <label style="color:var(--muted)">seed <select id="seed"></select></label>
  <label style="color:var(--muted)">term <select id="term"></select></label>
  <div class="tabs" id="tabs"></div>
  <button id="play" class="primary">▶ play</button>
  <button id="step">step</button>
  <button id="freeze">❄ freeze &amp; ask</button>
  <button id="camOrbit" class="sel" title="outside view">🛰 city</button>
  <button id="camStreet" title="inside view">🚶 street</button>
  <label style="color:var(--muted)">speed <input id="speed" type="range" min="1" max="10" value="4" /></label>
  <input id="scrub" type="range" min="0" max="20" value="0" style="flex:1;min-width:140px" />
  <span id="year">year 0 / 20</span>
  <button id="togChamber" title="show/hide the council chamber">🗣</button>
  <button id="togPanel" title="show/hide the numbers">📊</button>
  <a href="iso.html" style="color:var(--muted);font-size:12px">isometric</a>
  <a href="index.html" style="color:var(--muted);font-size:12px">four-up</a>
</header>
<section id="chamber">
  <div class="portrait"><img id="mayorImg" alt="" /><div><div id="chName" class="n">—</div><div id="chPersona" class="p"></div></div><button id="chMin" title="hide the council chamber">–</button></div>
  <div class="feed" id="feed"></div>
</section>
<div id="game">
  <div id="loading">loading the city…</div>
  <div id="talk">💬 talk<small id="talkLabel"></small></div>
  <div id="fps" style="position:absolute;right:12px;bottom:10px;font-size:11px;padding:2px 8px;border-radius:999px;pointer-events:none">– fps</div>
  <div id="hint">drag to orbit · wheel to zoom · hover a building to talk · street view: WASD to walk, drag to look</div>
</div>
<aside>
  <h2><span id="mayorName">—</span><span class="score" id="score"></span></h2>
  <div class="decision" id="decision">load runs…</div>
  <div class="health" id="health"></div>
  <div class="fuse" id="fuse"></div>
  <div class="stats" id="stats"></div>
  <div class="ticker" id="ticker"></div>
  <div class="lessons" id="lessons"></div>
</aside>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module" src="city3d.js?v=1789279517"></script>
<script src="voice.js?v=1789276843"></script>
<script src="narrator.js?v=1789279517"></script>
<script src="explain.js?v=1789279517"></script>
<script src="runpanel.js?v=1789279517"></script>
</body>
</html>
